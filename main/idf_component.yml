dependencies:
  idf: ">=6.0"
  espressif/esp_lcd_ek79007: "^2.0.2"       # EK79007 MIPI-DSI panel controller
  espressif/esp_lcd_touch_gt911: "^1.2.1"   # GT911 touch
  espressif/esp_lvgl_port: "^2.9.0"
  lvgl/lvgl: "^9.6.0"
  espressif/esp_hosted:
    version: "~2.12.3"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "1.6.3"            # the last esp_wifi_remote that keeps esp_hosted < 3.0
    rules:
      - if: "target == esp32p4"
  espressif/esp_new_jpeg: "^1.0.2"          # software JPEG decoder that scales: the pictures too big for the JPEG engine
  espressif/cjson: "^1.7.19"                # JSON: config.json and the weather APIs (IDF 6 has no json component)
  espressif/esp_audio_codec: "2.5.0"        # the radio's MP3/AAC decoder; 2.6+ is built for P4 rev >= 3 only (its build fails here)
